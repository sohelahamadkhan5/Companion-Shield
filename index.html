    const { useState, useEffect, useMemo, useRef } = React;

    // --- Calming Web Audio Synthesizer (Zero External Dependencies) ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          audioCtx = new AudioCtxClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playUIFeedback(type, soundEnabled = true) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "nav") {
          // Soft grounding marimba knock (Low freq, fast decay - calming)
          osc.type = "sine";
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === "urge") {
          // Deep anchoring bowl (136.1Hz Om frequency)
          osc.type = "sine";
          osc.frequency.setValueAtTime(136.1, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.08, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
          
          const osc2 = ctx.createOscillator();
          osc2.type = "sine";
          osc2.frequency.value = 136.1 * 2; // harmonic
          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0, now);
          g2.gain.linearRampToValueAtTime(0.02, now + 0.1);
          g2.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
          osc2.connect(g2);
          g2.connect(ctx.destination);
          
          osc.start(now); osc.stop(now + 2.1);
          osc2.start(now); osc2.stop(now + 1.6);
        } else if (type === "save_positive") {
          // Victorious shimmer (C Major arpeggio - dopamine reinforcing)
          const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          freqs.forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "triangle";
            o.frequency.value = f;
            o.connect(g);
            g.connect(ctx.destination);
            const t = now + (i * 0.08);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.05, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
            o.start(t);
            o.stop(t + 0.8);
          });
          gain.disconnect(); // Cancel base osc since we made individual ones
        } else if (type === "save_negative") {
          // Compassionate, soft descending hum (Non-punishing to avoid shame)
          osc.type = "sine";
          osc.frequency.setValueAtTime(220, now); // A3
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.5);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.04, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.start(now);
          osc.stop(now + 0.75);
        } else if (type === "toggle") {
          // Soft organic glass tick (unobtrusive UI feedback)
          osc.type = "sine";
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.02, now + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch(e) {}
    }

    function playSoftClick(soundEnabled = true) {

    function playBreathTone(phase, soundEnabled = true) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";

        if (phase === "Breathe in") {
          // Ascending harmonic frequency (174Hz to 240Hz)
          osc.frequency.setValueAtTime(174, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 3.8);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.065, now + 1.6);
          gain.gain.linearRampToValueAtTime(0.03, now + 3.8);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);
        } else if (phase === "Breathe out") {
          // Grounding descending frequency (240Hz down to 136.1Hz - heart / Om)
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(136.1, now + 3.8);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.linearRampToValueAtTime(0.025, now + 2.0);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);
        } else {
          // Hold phase: serene soft chime
          osc.frequency.setValueAtTime(216, now);
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);
        }

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 4.0);
      } catch(e) {}
    }

      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function addDays(base, n) {
      const d = new Date(base);
      d.setDate(d.getDate() + n);
      return d;
    }

    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    function seedData() {
      const today = new Date();
      const pattern = [1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 1, 1, 1, 1, 1, 1, 0, 1];
      const feelings = [
        "Positive", "Positive", "Neutral", "Negative", "Positive", "Urge", "Positive",
        "Neutral", "Positive", "Negative", "Neutral", "Positive", "Urge", "Positive",
        "Positive", "Neutral", "Negative", "Positive"
      ];
      const rows = [];
      for (let i = pattern.length; i >= 1; i--) {
        const d = addDays(today, -i);
        const pure = pattern[pattern.length - i] === 1;
        rows.push({
          date: toKey(d),
          stayedPure: pure,
          gazeGuarded: pure ? Math.random() > 0.15 : Math.random() > 0.6,
          feeling: pure ? feelings[pattern.length - i] : "Negative",
        });
      }
      return rows;
    }

      });

      const [sheetUrl, setSheetUrl] = useState(() => {
        try {
          const saved = localStorage.getItem("companion_sheet_url");
          if (saved && saved.trim().length > 0) return saved;
          return DEFAULT_APPS_SCRIPT_URL;
        } catch (e) {
          return DEFAULT_APPS_SCRIPT_URL;
        }
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncMessage, setSyncMessage] = useState("");

      const syncWithSheet = async (customUrl) => {
        const targetUrl = (customUrl !== undefined ? customUrl : sheetUrl || DEFAULT_APPS_SCRIPT_URL).trim();
        if (!targetUrl) return;

        setIsSyncing(true);
        setSyncMessage("Syncing with Google Sheet…");
        try {
          const res = await fetch(targetUrl);
          const data = await res.json();
          if (data.whys && Array.isArray(data.whys) && data.whys.length > 0) {
            setWhys(data.whys);
          }
          if (data.logs && Array.isArray(data.logs) && data.logs.length > 0) {
            setTransactions(data.logs);
          }
          setSyncMessage("Synced with Google Sheet ✓");
          setTimeout(() => setSyncMessage(""), 3000);
        } catch (err) {
          console.error("Sheet sync error:", err);
          setSyncMessage("Could not sync — check script URL");
          setTimeout(() => setSyncMessage(""), 4000);
        } finally {
          setIsSyncing(false);
        }
      };

      // Auto-sync on startup
      useEffect(() => {
        if (sheetUrl) {
          syncWithSheet(sheetUrl);
        }
      }, []);

      const saveEntryToSheet = async (entry) => {

        setSheetUrl(newUrl);

        <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
          {dots.map((d, i) => (
            <div
              key={i}
              style={{
                position: "absolute",
                top: `${d.top}%`,
                left: `${d.left}%`,
                width: d.size,
                height: d.size,
                borderRadius: "50%",
                background: C.sand,
                animation: `twinkle ${3 + d.delay}s ease-in-out infinite`,
                animationDelay: `${d.delay}s`

          ))}

    function WeekStrip({ transactions }) {
      const days = Array.from({ length: 7 }, (_, i) => addDays(new Date(), -(6 - i)));
      const map = useMemo(() => Object.fromEntries(transactions.map(t => [t.date, t])), [transactions]);

        <div style={{ display: "flex", justifyContent: "space-between", background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 16, padding: "14px 10px" }}>
          {days.map((d) => {
            const key = toKey(d);
            const t = map[key];
            const isToday = key === toKey(new Date());
            let color = C.hair, fill = "transparent";
            if (t) {
              color = t.stayedPure ? C.sage : C.rust;
              fill = t.stayedPure ? `${C.sage}33` : `${C.rust}33`;
            }
            return (
              <div key={key} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>

                  borderRadius: "50%",

    function UrgeOverlay({ whys, onClose, onLog, soundEnabled }) {
      const [seconds, setSeconds] = useState(60);
      const [whyIdx, setWhyIdx] = useState(0);

      const cyclePos = (60 - seconds) % 16;
      const phase = cyclePos < 4 ? "Breathe in" : cyclePos < 8 ? "Hold" : cyclePos < 12 ? "Breathe out" : "Hold";

      // Trigger harmonic chime tone at each 4-second breath transition
      useEffect(() => {
        if (seconds > 0 && cyclePos % 4 === 0) {
          playBreathTone(phase, soundEnabled);
        }
      }, [seconds, cyclePos, soundEnabled]);

      useEffect(() => {
        const t = setInterval(() => setSeconds((s) => Math.max(0, s - 1)), 1000);
        const w = whys.length > 1 ? setInterval(() => setWhyIdx((i) => (i + 1) % whys.length), 5000) : null;
        return () => {
          clearInterval(t);
          if (w) clearInterval(w);
        };
      }, [whys.length]);

      const done = seconds === 0;

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 50, background: C.bg, display: "flex", flexDirection: "column" }}>

                      position: "absolute", inset: 0, borderRadius: "50%",

    function UrgeWave({ seconds }) {
      const bars = 24;
      const elapsed = 60 - seconds;
      return (
        <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 44, width: 220 }}>
          {Array.from({ length: bars }).map((_, i) => {
            const offset = (i / bars) * 60;
            const dist = Math.abs(elapsed - offset);
            const h = Math.max(10, 100 - dist * 6);
            const active = elapsed >= offset;
            return (
              <div key={i} style={{
                flex: 1,
                height: `${active ? h : 10}%`,
                borderRadius: 3,
                background: active ? C.gold : C.hair,
                transition: "height 0.4s ease"
              }} />
            );
          })}
        </div>
      );
    }

          setPure(true);
          clearPrefill();

        // Play specific sound based on purity status
        if (pure) {
          playUIFeedback("save_positive", soundEnabled);

        const entry = { date, stayedPure: pure, gazeGuarded: gaze, feeling };

          return [...rest, entry].sort((a, b) => a.date.localeCompare(b.date));

    function DonutChart({ data }) {
      const total = data.reduce((s, d) => s + d.value, 0);
      if (total === 0) return null;
      let acc = 0;
      const size = 110;
      const stroke = 14;
      const r = (size - stroke) / 2;
      const circ = 2 * Math.PI * r;

      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          {data.map((d, i) => {
            const frac = d.value / total;
            const dash = frac * circ;
            const offset = circ * (0.25 - acc);
            acc += frac;
            return (
              <circle
                key={i}
                cx={size / 2}
                cy={size / 2}
                r={r}
                fill="transparent"
                stroke={d.color}
                strokeWidth={stroke}
                strokeDasharray={`${dash} ${circ - dash}`}
                strokeDashoffset={offset}
              />
            );
          })}
        </svg>
      );
    }

    function MonthHeatmap({ transactions, displayDate, onMonthChange, onResetToCurrentMonth }) {
      const map = useMemo(() => Object.fromEntries(transactions.map((t) => [t.date, t])), [transactions]);
      const activeDate = displayDate || new Date();
      const year = activeDate.getFullYear();
      const month = activeDate.getMonth();

    function parseDateKey(key) {
      if (!key || typeof key !== "string") return null;
      const parts = key.slice(0, 10).split("-");
      if (parts.length !== 3) return null;
      const [y, m, d] = parts.map(Number);
      if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
      const date = new Date(y, m - 1, d);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function daysDiff(d1, d2) {
      const t1 = Date.UTC(d1.getFullYear(), d1.getMonth(), d1.getDate());
      const t2 = Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate());
      return Math.round((t1 - t2) / (1000 * 60 * 60 * 24));
    }

    function computeCurrentStreak(transactions) {
      if (!transactions || transactions.length === 0) return { count: 0 };

      // Deduplicate entries by calendar date
      const map = new Map();
      transactions.forEach((t) => {
        if (t.date) map.set(t.date.slice(0, 10), t);
      });

      const sorted = Array.from(map.values())
        .filter((t) => parseDateKey(t.date) !== null)
        .sort((a, b) => b.date.localeCompare(a.date));

      if (sorted.length === 0) return { count: 0 };

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const latestDate = parseDateKey(sorted[0].date);
      const diffFromToday = daysDiff(today, latestDate);

      // If the latest logged date is older than yesterday, current streak has lapsed
      if (diffFromToday > 1) {
        return { count: 0 };
      }

      // If the latest entry was a relapse, current streak is 0
      if (!sorted[0].stayedPure) {
        return { count: 0 };
      }

      let count = 1;
      let prevDate = latestDate;

      for (let i = 1; i < sorted.length; i++) {
        const curr = sorted[i];
        const currDate = parseDateKey(curr.date);
        // Verify entries are strictly 1 calendar day apart
        if (daysDiff(prevDate, currDate) === 1) {
          if (curr.stayedPure) {
            count++;
            prevDate = currDate;
          } else {
            break;
          }
        } else {
          // A missed date gap breaks continuous streak
          break;
        }
      }

      return { count };
    }

    function computeLongestStreak(transactions) {
      if (!transactions || transactions.length === 0) return 0;

      const map = new Map();
      transactions.forEach((t) => {
        if (t.date) map.set(t.date.slice(0, 10), t);
      });

      const sorted = Array.from(map.values())
        .filter((t) => parseDateKey(t.date) !== null)
        .sort((a, b) => a.date.localeCompare(b.date));

      let maxStreak = 0;
      let cur = 0;
      let prevDate = null;

      for (const t of sorted) {
        const currDate = parseDateKey(t.date);

        if (t.stayedPure) {
          if (prevDate && daysDiff(currDate, prevDate) === 1) {
            cur++;
          } else {
            cur = 1;
          }
          prevDate = currDate;
          if (cur > maxStreak) {
            maxStreak = cur;
          }
        } else {
          cur = 0;
          prevDate = currDate;
        }
      }

      return maxStreak;
    }

    function pct(n, d) {
      return d === 0 ? 0 : Math.round((n / d) * 100);
    }

    function computeRiskWeekday(transactions) {
      if (transactions.length < 7) return null;
      const buckets = {};
      transactions.forEach((t) => {
        const wd = WEEKDAYS[new Date(t.date + "T00:00:00").getDay()];
        buckets[wd] = buckets[wd] || { total: 0, relapse: 0 };
        buckets[wd].total++;
        if (!t.stayedPure) buckets[wd].relapse++;
      });
      let worst = null, worstRate = 0;
      Object.entries(buckets).forEach(([wd, { total, relapse }]) => {
        if (total < 2) return;
        const rate = relapse / total;
        if (rate > worstRate) {
          worstRate = rate;
          worst = wd;
        }
      });
      return worstRate > 0 ? fullDayName(worst) : null;
    }

    function fullDayName(short) {
      const map = { Sun: "Sunday", Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" };
      return map[short] || short;
    }

    function computeRecentTrend(transactions) {
      const sorted = [...transactions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
      const toughCount = sorted.filter((t) => t.feeling === "Negative" || t.feeling === "Urge").length;
      if (toughCount >= 2) {
        return "The last few days have felt heavier than usual — that's worth noticing, not fixing alone. Consider revisiting your whys or reaching out to someone you trust.";
      }
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
