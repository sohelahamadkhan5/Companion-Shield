<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Companion</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background-color: #0B1F26;
      color: #EAE3D3;
      font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .serif { font-family: 'Fraunces', Georgia, serif; }
    @keyframes breathe {
      0%   { transform: scale(0.94); opacity: 0.55; }
      50%  { transform: scale(1.08); opacity: 0.95; }
      100% { transform: scale(0.94); opacity: 0.55; }
    }
    @keyframes breatheSlow {
      0%   { transform: scale(0.9); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(0.9); }
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.9; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fadeIn { animation: fadeSlide 0.6s ease both; }
    .slideUp { animation: slideUp 0.45s ease both; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const C = {
      bg: "#0B1F26",
      bg2: "#0F2730",
      panel: "#12313D",
      panelSoft: "#16394630",
      hair: "#25454F",
      sand: "#EAE3D3",
      sandDim: "#AEC0BE",
      gold: "#D8B26E",
      goldSoft: "#D8B26E22",
      sage: "#6FA98F",
      rust: "#C77B5A",
      slate: "#7E97A0",
    };

    const Settings = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>

    );

    const X = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>

    );

    const Plus = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );

    const Trash2 = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    );

    const Flame = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
      </svg>
    );

    const Trophy = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/>
      </svg>
    );

    const Shield = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    );

    const Wind = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
        <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
        <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
      </svg>
    );

    const Sun = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    );

    const Moon = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    );

    const Sparkles = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        <path d="M5 3v4M3 5h4M19 17v4M17 19h4"/>
      </svg>
    );

    const PenLine = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
    );

    const BarChart3 = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M3 3v18h18"/>
        <path d="M18 17V9"/>
        <path d="M13 17V5"/>
        <path d="M8 17v-3"/>
      </svg>
    );

    const Compass = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
    );

    const Cloud = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
      </svg>
    );

    const RefreshCw = ({ size = 16, color = "currentColor", className = "", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...p}>
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
    );

    const Check = ({ size = 16, color = "currentColor", ...p }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    const FEELINGS = [
      { key: "Positive", label: "Positive", color: C.sage, Icon: Sun },
      { key: "Neutral", label: "Neutral", color: C.slate, Icon: Moon },
      { key: "Negative", label: "Negative", color: C.rust, Icon: Compass },
      { key: "Urge", label: "A little urge — controlled", color: C.gold, Icon: Wind },
    ];

    // Single core Why from Companion101 sheet
    const DEFAULT_WHYS = [
      "Because I don't want a moment of weakness to distance me from Allah and burden my heart with guilt and regret.",
    ];

    const DEFAULT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1jPac8drSw4oyARsX0PbxSlK8LR_AMll-DQik5ZnGBfOOoG6YIEfnxwBpypdLXhmVZg/exec";

    const APPS_SCRIPT_TEMPLATE = `function doGet() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  
  // 1. Read Whys (Sheet2 or first sheet)
  let whys = [];
  const whysSheet = ss.getSheetByName("Sheet2") || ss.getSheetByName("Whys") || ss.getSheets()[1];
  if (whysSheet) {
    const data = whysSheet.getDataRange().getValues();
    whys = data.flat().filter(r => r && String(r).trim().length > 0 && !["why", "whys", "reason"].includes(String(r).toLowerCase()));
  }

  // 2. Read Daily Check-ins (Sheet1 or first sheet)
  let logs = [];
  const logSheet = ss.getSheetByName("Sheet1") || ss.getSheetByName("Logs") || ss.getSheets()[0];
  if (logSheet) {
    const rows = logSheet.getDataRange().getValues();
    if (rows.length > 1) {
      for (let i = 1; i < rows.length; i++) {
        const [d, pure, gaze, feeling] = rows[i];
        if (d) {
          const dateStr = d instanceof Date ? Utilities.formatDate(d, Session.getScriptTimeZone(), "yyyy-MM-dd") : String(d).slice(0, 10);
          logs.push({
            date: dateStr,
            stayedPure: pure === true || String(pure).toLowerCase() === "yes" || pure === 1,
            gazeGuarded: gaze === true || String(gaze).toLowerCase() === "yes" || gaze === 1,
            feeling: feeling || "Positive"
          });
        }
      }
    }
  }

  return ContentService.createTextOutput(JSON.stringify({ whys: whys.length ? whys : null, logs }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    const data = JSON.parse(e.postData.contents);
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const logSheet = ss.getSheetByName("Sheet1") || ss.getSheetByName("Logs") || ss.getSheets()[0];
    
    // Check if row for this date already exists to update or append
    const rows = logSheet.getDataRange().getValues();
    let updated = false;
    for (let i = 1; i < rows.length; i++) {
      const d = rows[i][0];
      const dStr = d instanceof Date ? Utilities.formatDate(d, Session.getScriptTimeZone(), "yyyy-MM-dd") : String(d).slice(0, 10);
      if (dStr === data.date) {
        logSheet.getRange(i + 1, 1, 1, 4).setValues([[data.date, data.stayedPure ? "Yes" : "No", data.gazeGuarded ? "Yes" : "No", data.feeling]]);
        updated = true;
        break;
      }
    }
    if (!updated) {
      logSheet.appendRow([data.date, data.stayedPure ? "Yes" : "No", data.gazeGuarded ? "Yes" : "No", data.feeling]);
    }
    return ContentService.createTextOutput(JSON.stringify({ status: "success" })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", error: err.message })).setMimeType(ContentService.MimeType.JSON);
  }
}`;

    function toKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function addDays(base, n) {
      const d = new Date(base);
      d.setDate(d.getDate() + n);
      return d;
    }

    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    function seedData() {
      const today = new Date();
      const pattern = [1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 1, 1, 1, 1, 1, 1, 0, 1];
      const feelings = [
        "Positive", "Positive", "Neutral", "Negative", "Positive", "Urge", "Positive",
        "Neutral", "Positive", "Negative", "Neutral", "Positive", "Urge", "Positive",
        "Positive", "Neutral", "Negative", "Positive"
      ];
      const rows = [];
      for (let i = pattern.length; i >= 1; i--) {
        const d = addDays(today, -i);
        const pure = pattern[pattern.length - i] === 1;
        rows.push({
          date: toKey(d),
          stayedPure: pure,
          gazeGuarded: pure ? Math.random() > 0.15 : Math.random() > 0.6,
          feeling: pure ? feelings[pattern.length - i] : "Negative",
        });
      }
      return rows;
    }

    function App() {
      const [tab, setTab] = useState("home");
      const [whys, setWhys] = useState(DEFAULT_WHYS);
      const [transactions, setTransactions] = useState(seedData);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [urgeMode, setUrgeMode] = useState(false);
      const [prefillUrge, setPrefillUrge] = useState(false);

      const [sheetUrl, setSheetUrl] = useState(() => {
        try {
          const saved = localStorage.getItem("companion_sheet_url");
          if (saved && saved.trim().length > 0) return saved;
          return DEFAULT_APPS_SCRIPT_URL;
        } catch (e) {
          return DEFAULT_APPS_SCRIPT_URL;
        }
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncMessage, setSyncMessage] = useState("");

      const syncWithSheet = async (customUrl) => {
        const targetUrl = (customUrl !== undefined ? customUrl : sheetUrl || DEFAULT_APPS_SCRIPT_URL).trim();
        if (!targetUrl) return;

        setIsSyncing(true);
        setSyncMessage("Syncing with Google Sheet…");
        try {
          const res = await fetch(targetUrl);
          const data = await res.json();
          if (data.whys && Array.isArray(data.whys) && data.whys.length > 0) {
            setWhys(data.whys);
          }
          if (data.logs && Array.isArray(data.logs) && data.logs.length > 0) {
            setTransactions(data.logs);
          }
          setSyncMessage("Synced with Google Sheet ✓");
          setTimeout(() => setSyncMessage(""), 3000);
        } catch (err) {
          console.error("Sheet sync error:", err);
          setSyncMessage("Could not sync — check script URL");
          setTimeout(() => setSyncMessage(""), 4000);
        } finally {
          setIsSyncing(false);
        }
      };

      // Auto-sync on initial mount if a sheet URL is configured
      useEffect(() => {
        if (sheetUrl) {
          syncWithSheet(sheetUrl);
        }
      }, []);

      const saveEntryToSheet = async (entry) => {
        const targetUrl = (sheetUrl || DEFAULT_APPS_SCRIPT_URL).trim();
        if (!targetUrl) return;
        try {
          await fetch(targetUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(entry),
          });
        } catch (err) {
          console.error("Failed to post entry to Google Sheet:", err);
        }
      };

      const handleUpdateSheetUrl = (newUrl) => {
        setSheetUrl(newUrl);
        try { localStorage.setItem("companion_sheet_url", newUrl); } catch (e) {}
        if (newUrl.trim()) {
          syncWithSheet(newUrl);
        }
      };

      return (
        <div style={{ background: C.bg, minHeight: "100vh", color: C.sand, fontFamily: "'Manrope', ui-sans-serif, system-ui" }}>
          <div style={{ maxWidth: 460, margin: "0 auto", minHeight: "100vh", position: "relative", paddingBottom: 84 }}>
            {tab === "home" && (
              <HomeScreen
                whys={whys}
                transactions={transactions}
                onOpenSettings={() => setSettingsOpen(true)}
                onUrge={() => setUrgeMode(true)}
                sheetConnected={!!sheetUrl}
                isSyncing={isSyncing}
                syncMessage={syncMessage}
                onTriggerSync={() => syncWithSheet()}
              />
            )}
            {tab === "log" && (
              <LogScreen
                transactions={transactions}
                setTransactions={setTransactions}
                prefillUrge={prefillUrge}
                clearPrefill={() => setPrefillUrge(false)}
                onSaveToSheet={saveEntryToSheet}
                sheetConnected={!!sheetUrl}
              />
            )}
            {tab === "dashboard" && <DashboardScreen transactions={transactions} />}

            <BottomNav tab={tab} setTab={setTab} />

            {settingsOpen && (
              <WhysSettings
                whys={whys}
                setWhys={setWhys}
                onClose={() => setSettingsOpen(false)}
                sheetUrl={sheetUrl}
                onUpdateSheetUrl={handleUpdateSheetUrl}
                onSyncNow={() => syncWithSheet()}
                isSyncing={isSyncing}
              />
            )}
            {urgeMode && (
              <UrgeOverlay
                whys={whys}
                onClose={() => setUrgeMode(false)}
                onLog={() => { setUrgeMode(false); setPrefillUrge(true); setTab("log"); }}
              />
            )}
          </div>
        </div>
      );
    }

    function HomeScreen({ whys, transactions, onOpenSettings, onUrge, sheetConnected, isSyncing, syncMessage, onTriggerSync }) {
      const [idx, setIdx] = useState(0);
      const timerRef = useRef(null);

      useEffect(() => {
        if (whys.length <= 1) {
          setIdx(0);
          return;
        }
        timerRef.current = setInterval(() => setIdx((i) => (i + 1) % whys.length), 6500);
        return () => clearInterval(timerRef.current);
      }, [whys.length]);

      const streak = useMemo(() => computeCurrentStreak(transactions), [transactions]);

      return (
        <div>
          {/* Starfield header */}
          <div style={{ position: "relative", overflow: "hidden", paddingTop: 22, paddingBottom: 6 }}>
            <Stars />
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 20px", position: "relative" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ width: 8, height: 8, borderRadius: 99, background: C.gold, boxShadow: `0 0 10px ${C.gold}` }} />
                <span style={{ fontSize: 13, letterSpacing: 0.3, color: C.sandDim }}>Companion</span>
                {sheetConnected && (
                  <button
                    onClick={onTriggerSync}
                    title="Google Sheet connected. Click to refresh."
                    style={{
                      background: `${C.sage}22`,
                      border: `1px solid ${C.sage}55`,
                      color: C.sage,
                      fontSize: 10,
                      fontWeight: 700,
                      padding: "2px 7px",
                      borderRadius: 99,
                      display: "flex",
                      alignItems: "center",
                      gap: 4,
                      cursor: "pointer"
                    }}
                  >
                    <Cloud size={10} color={C.sage} />
                    <span>{isSyncing ? "Syncing…" : "Live Sheet"}</span>
                  </button>
                )}
              </div>
              <button
                onClick={onOpenSettings}
                aria-label="Settings"
                style={{
                  background: C.panel,
                  border: `1px solid ${C.hair}`,
                  borderRadius: 99,
                  width: 38,
                  height: 38,
                  display: "grid",
                  placeItems: "center",
                  cursor: "pointer"
                }}
              >
                <Settings size={17} color={C.sandDim} />
              </button>
            </div>

            {syncMessage && (
              <div style={{ textAlign: "center", marginTop: 8, fontSize: 11, color: C.gold }}>
                {syncMessage}
              </div>
            )}

            {streak.count > 0 && (
              <div style={{ position: "relative", display: "flex", justifyContent: "center", marginTop: 14 }}>
                <div style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 6,
                  background: C.goldSoft,
                  border: `1px solid ${C.gold}55`,
                  padding: "6px 14px",
                  borderRadius: 99
                }}>
                  <Flame size={14} color={C.gold} />
                  <span style={{ fontSize: 13, fontWeight: 700, color: C.gold }}>

    function WhysSettings({ whys, setWhys, onClose, sheetUrl, onUpdateSheetUrl, onSyncNow, isSyncing }) {

      const fileInputRef = useRef(null);

      function handleFileUpload(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const content = evt.target?.result;
          if (typeof content !== "string") return;

          const lines = content
            .split(/\r?\n/)
            .map((l) => l.trim().replace(/^["']|["']$/g, ""))
            .filter((l) => l.length > 0);

          const cleanLines = lines.filter(
            (l) => !["why", "my why", "whys", "reason", "motivation", "reasons"].includes(l.toLowerCase())
          );

          if (cleanLines.length > 0) {
            setWhys(cleanLines);
          }
        };
        reader.readAsText(file);
      }

      function copyScriptCode() {
        const textarea = document.createElement("textarea");
        textarea.value = APPS_SCRIPT_TEMPLATE;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        setCopiedCode(true);
        setTimeout(() => setCopiedCode(false), 2500);
      }

    function UrgeOverlay({ whys, onClose, onLog }) {
      const [seconds, setSeconds] = useState(60);
      const [whyIdx, setWhyIdx] = useState(0);

      useEffect(() => {
        const t = setInterval(() => setSeconds((s) => Math.max(0, s - 1)), 1000);
        const w = whys.length > 1 ? setInterval(() => setWhyIdx((i) => (i + 1) % whys.length), 5000) : null;
        return () => {
          clearInterval(t);
          if (w) clearInterval(w);
        };
      }, [whys.length]);

      const cyclePos = (60 - seconds) % 16;
      const phase = cyclePos < 4 ? "Breathe in" : cyclePos < 8 ? "Hold" : cyclePos < 12 ? "Breathe out" : "Hold";
      const done = seconds === 0;

      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 50, background: C.bg, display: "flex", flexDirection: "column" }}>
          <div style={{ maxWidth: 460, margin: "0 auto", width: "100%", flex: 1, display: "flex", flexDirection: "column", padding: "20px 24px 32px" }}>
            <div style={{ display: "flex", justifyContent: "flex-end" }}>
              <button
                onClick={onClose}
                style={{
                  background: C.panel,
                  border: `1px solid ${C.hair}`,
                  borderRadius: 99,
                  width: 34,
                  height: 34,
                  display: "grid",
                  placeItems: "center",
                  cursor: "pointer"
                }}
              >
                <X size={15} color={C.sandDim} />
              </button>
            </div>

            <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 28 }}>
              {!done ? (
                <React.Fragment>
                  <div style={{ position: "relative", width: 190, height: 190, display: "grid", placeItems: "center" }}>
                    <div style={{
                      position: "absolute", inset: 0, borderRadius: "50%",
                      background: `radial-gradient(circle, ${C.gold}55, ${C.gold}0a 60%, transparent 75%)`,
                      animation: "breathe 8s ease-in-out infinite"
                    }} />
                    <div style={{ fontSize: 28, fontWeight: 800, color: C.sand }}>{seconds}</div>
                  </div>
                  <div className="serif" style={{ fontSize: 20, color: C.gold, letterSpacing: 0.5 }}>{phase}</div>

                  <UrgeWave seconds={seconds} />

                  <p key={whyIdx} className="fadeIn serif" style={{ fontSize: 15, lineHeight: 1.5, textAlign: "center", color: C.sand, minHeight: 70 }}>
                    {whys[whyIdx] || whys[0]}
                  </p>
                </React.Fragment>
              ) : (
                <div className="fadeIn" style={{ textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 18 }}>
                  <Sparkles size={30} color={C.gold} />
                  <p className="serif" style={{ fontSize: 19, color: C.sand, lineHeight: 1.5 }}>
                    The wave passed. That was you — staying you.
                  </p>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10, width: 240, marginTop: 6 }}>
                    <button
                      onClick={onClose}
                      style={{
                        background: C.gold,
                        border: "none",
                        borderRadius: 14,
                        padding: "13px 0",
                        fontWeight: 800,
                        color: "#1a1204",
                        fontSize: 14,
                        cursor: "pointer"
                      }}
                    >
                      I'm steady now
                    </button>
                    <button
                      onClick={onLog}
                      style={{
                        background: "transparent",
                        border: `1px solid ${C.hair}`,
                        borderRadius: 14,
                        padding: "13px 0",
                        color: C.sandDim,
                        fontSize: 13.5,
                        cursor: "pointer"
                      }}
                    >
                      Log this moment
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function UrgeWave({ seconds }) {
      const bars = 24;
      const elapsed = 60 - seconds;
      return (
        <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 44, width: 220 }}>
          {Array.from({ length: bars }).map((_, i) => {
            const offset = (i / bars) * 60;
            const dist = Math.abs(elapsed - offset);
            const h = Math.max(10, 100 - dist * 6);
            const active = elapsed >= offset;
            return (
              <div
                key={i}
                style={{
                  flex: 1,
                  height: `${active ? h : 10}%`,
                  borderRadius: 3,
                  background: active ? C.gold : C.hair,
                  transition: "height 0.4s ease"
                }}
              />
            );
          })}
        </div>
      );
    }

    function LogScreen({ transactions, setTransactions, prefillUrge, clearPrefill, onSaveToSheet, sheetConnected }) {
      const todayKey = toKey(new Date());
      const existing = transactions.find((t) => t.date === todayKey);

      const [date, setDate] = useState(todayKey);
      const [pure, setPure] = useState(existing?.stayedPure ?? true);
      const [gaze, setGaze] = useState(existing?.gazeGuarded ?? true);
      const [feeling, setFeeling] = useState(existing?.feeling ?? "Positive");
      const [saved, setSaved] = useState(false);

      useEffect(() => {
        if (prefillUrge) {
          setFeeling("Urge");
          setPure(true);
          clearPrefill();
        }
      }, [prefillUrge]);

      function handleSave() {
        const newEntry = { date, stayedPure: pure, gazeGuarded: gaze, feeling };
        setTransactions((prev) => {
          const rest = prev.filter((t) => t.date !== date);
          return [...rest, newEntry].sort((a, b) =>
            a.date.localeCompare(b.date)
          );
        });

        // Auto sync to Google Sheet if connected
        if (onSaveToSheet) {
          onSaveToSheet(newEntry);
        }

        setSaved(true);
        setTimeout(() => setSaved(false), 2200);
      }

      const recent = [...transactions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

      return (
        <div style={{ padding: "24px 20px" }}>
          <h1 className="serif" style={{ fontSize: 23, margin: "0 0 4px" }}>Today's check-in</h1>
          <p style={{ fontSize: 12.5, color: C.sandDim, margin: "0 0 22px" }}>A minute of honesty, kept just for you.</p>

          <Field label="Date">
            <input
              type="date"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              style={{
                width: "100%",
                background: C.panel,
                border: `1px solid ${C.hair}`,
                borderRadius: 12,
                padding: "12px 14px",
                color: C.sand,
                fontSize: 14
              }}
            />
          </Field>

          <Field label="Did I stay pure?">
            <SegToggle value={pure} onChange={setPure} yesLabel="Yes" noLabel="No" />
          </Field>

          <Field label="Gaze guarded?">
            <SegToggle value={gaze} onChange={setGaze} yesLabel="Yes" noLabel="No" />
          </Field>

          <Field label="How are you feeling?">
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {FEELINGS.map(({ key, label, color, Icon }) => (
                <button
                  key={key}
                  onClick={() => setFeeling(key)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    padding: "12px 14px",
                    borderRadius: 12,
                    background: feeling === key ? `${color}22` : C.panel,
                    border: `1px solid ${feeling === key ? color : C.hair}`,
                    textAlign: "left",
                    cursor: "pointer"
                  }}
                >
                  <Icon size={16} color={color} />
                  <span style={{ fontSize: 13.5, color: C.sand }}>{label}</span>
                  {feeling === key && <Check size={14} color={color} style={{ marginLeft: "auto" }} />}
                </button>
              ))}
            </div>
          </Field>

          <button
            onClick={handleSave}
            style={{
              width: "100%",
              background: C.gold,
              border: "none",
              borderRadius: 14,
              padding: "14px 0",
              fontWeight: 800,
              color: "#1a1204",
              fontSize: 14.5,
              marginTop: 6,
              cursor: "pointer"
            }}
          >
            {saved ? (sheetConnected ? "Saved & Synced to Sheet ✓" : "Saved ✓") : "Save today's entry"}
          </button>
          <p style={{ fontSize: 11, color: C.sandDim, textAlign: "center", marginTop: 8 }}>
            {sheetConnected ? "🟢 Connected to Google Sheet (Sync active)" : "Tip: Connect your Google Sheet in settings for live cloud sync"}
          </p>

          <div style={{ marginTop: 30 }}>
            <h3 style={{ fontSize: 12, letterSpacing: 0.5, color: C.sandDim, marginBottom: 10 }}>Recent entries</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {recent.map((t) => {
                const f = FEELINGS.find((x) => x.key === t.feeling);
                return (
                  <div
                    key={t.date}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 10,
                      background: C.panel,
                      border: `1px solid ${C.hair}`,
                      borderRadius: 12,
                      padding: "10px 12px"
                    }}
                  >
                    <span style={{ fontSize: 12.5, color: C.sandDim, width: 74 }}>{t.date.slice(5)}</span>
                    <Shield size={13} color={t.gazeGuarded ? C.sage : C.rust} />
                    <span style={{ width: 6, height: 6, borderRadius: 99, background: t.stayedPure ? C.sage : C.rust }} />
                    <span style={{ fontSize: 12, color: C.sandDim, marginLeft: "auto" }}>{f?.label}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function Field({ label, children }) {
      return (
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12, color: C.sandDim, marginBottom: 8 }}>{label}</div>
          {children}
        </div>
      );
    }

    function SegToggle({ value, onChange, yesLabel, noLabel }) {
      return (
        <div style={{ display: "flex", background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 12, padding: 4 }}>
          {[{ v: true, l: yesLabel }, { v: false, l: noLabel }].map(({ v, l }) => (
            <button
              key={l}
              onClick={() => onChange(v)}
              style={{
                flex: 1,
                padding: "10px 0",
                borderRadius: 9,
                border: "none",
                fontSize: 13.5,
                fontWeight: 700,
                background: value === v ? (v ? C.sage : C.rust) : "transparent",
                color: value === v ? "#0B1F26" : C.sandDim,
                cursor: "pointer"
              }}
            >
              {l}
            </button>
          ))}
        </div>
      );
    }

    function DashboardScreen({ transactions }) {
      const [range, setRange] = useState(30);
      const filtered = useMemo(() => {
        if (range === 0) return transactions;
        const cutoff = toKey(addDays(new Date(), -range));
        return transactions.filter((t) => t.date >= cutoff);
      }, [transactions, range]);

      const streak = computeCurrentStreak(transactions);
      const longest = computeLongestStreak(transactions);
      const purityRate = pct(filtered.filter((t) => t.stayedPure).length, filtered.length);
      const gazeRate = pct(filtered.filter((t) => t.gazeGuarded).length, filtered.length);
      const riskDay = computeRiskWeekday(transactions);
      const recentAlert = computeRecentTrend(transactions);

      const feelingData = FEELINGS.map((f) => ({
        name: f.label.split(" ")[0],
        key: f.key,
        value: filtered.filter((t) => t.feeling === f.key).length,
        color: f.color,
      })).filter((d) => d.value > 0);

      const barData = filtered.slice(-14).map((t) => ({
        date: t.date.slice(5),
        ok: t.stayedPure,
      }));

      return (
        <div style={{ padding: "24px 20px" }}>
          <h1 className="serif" style={{ fontSize: 23, margin: "0 0 4px" }}>Your patterns</h1>
          <p style={{ fontSize: 12.5, color: C.sandDim, margin: "0 0 18px" }}>Not a scoreboard — a mirror, so you can plan around it.</p>

          <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
            {[{ l: "7D", v: 7 }, { l: "30D", v: 30 }, { l: "90D", v: 90 }, { l: "All", v: 0 }].map((r) => (
              <button
                key={r.l}
                onClick={() => setRange(r.v)}
                style={{
                  padding: "7px 14px",
                  borderRadius: 99,
                  fontSize: 12.5,
                  fontWeight: 700,
                  background: range === r.v ? C.gold : C.panel,
                  color: range === r.v ? "#1a1204" : C.sandDim,
                  border: `1px solid ${range === r.v ? C.gold : C.hair}`,
                  cursor: "pointer"
                }}
              >
                {r.l}
              </button>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
            <StatCard icon={<Flame size={15} color={C.gold} />} label="Current streak" value={`${streak.count}d`} />
            <StatCard icon={<Trophy size={15} color={C.gold} />} label="Longest streak" value={`${longest}d`} />
            <StatCard icon={<Shield size={15} color={C.sage} />} label="Purity rate" value={`${purityRate}%`} />
            <StatCard icon={<Shield size={15} color={C.sage} />} label="Gaze guarded" value={`${gazeRate}%`} />
          </div>

          {(riskDay || recentAlert) && (
            <div style={{ background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 14, padding: 14, marginBottom: 16, display: "flex", gap: 10 }}>
              <Compass size={16} color={C.gold} style={{ flexShrink: 0, marginTop: 1 }} />
              <div style={{ fontSize: 12.5, color: C.sandDim, lineHeight: 1.5 }}>
                {recentAlert && <div style={{ marginBottom: riskDay ? 6 : 0 }}>{recentAlert}</div>}
                {riskDay && (
                  <div>
                    Historically, <b style={{ color: C.sand }}>{riskDay}</b> has been your toughest day of the week — plan something grounding for it.
                  </div>
                )}
              </div>
            </div>
          )}

          <SectionTitle>Daily consistency</SectionTitle>
          <div style={{ background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 16, padding: "16px 12px 12px", marginBottom: 18 }}>
            <ConsistencyBars data={barData} />
          </div>

          {feelingData.length > 0 && (
            <React.Fragment>
              <SectionTitle>How you've been feeling</SectionTitle>
              <div style={{ background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 16, padding: 14, marginBottom: 18, display: "flex", alignItems: "center", gap: 14 }}>
                <DonutChart data={feelingData} />
                <div style={{ display: "flex", flexDirection: "column", gap: 6, flex: 1 }}>
                  {feelingData.map((d) => (
                    <div key={d.key} style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12 }}>
                      <span style={{ width: 8, height: 8, borderRadius: 99, background: d.color }} />
                      <span style={{ color: C.sandDim }}>{d.name}</span>
                      <span style={{ color: C.sand, fontWeight: 700, marginLeft: "auto" }}>{d.value}</span>
                    </div>
                  ))}
                </div>
              </div>
            </React.Fragment>
          )}

          <SectionTitle>This month</SectionTitle>
          <MonthHeatmap transactions={transactions} />

          <p style={{ fontSize: 10.5, color: C.sandDim, textAlign: "center", marginTop: 20, lineHeight: 1.5 }}>
            Sample history shown for preview. Your real check-ins will replace this once connected to your sheet.
          </p>
        </div>
      );
    }

    function ConsistencyBars({ data }) {
      if (!data.length) return <div style={{ height: 90, display: "grid", placeItems: "center", color: C.sandDim, fontSize: 11 }}>No entries in range</div>;
      return (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", height: 96, gap: 4 }}>
          {data.map((item, idx) => (
            <div key={idx} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", height: "100%", justifyContent: "flex-end" }}>
              <div
                title={`${item.date}: ${item.ok ? "Pure" : "Relapse"}`}
                style={{
                  width: "100%",
                  maxWidth: 16,
                  height: item.ok ? "78%" : "28%",
                  borderRadius: 4,
                  background: item.ok ? C.sage : C.rust,
                  transition: "height 0.3s ease"
                }}
              />
              <span style={{ fontSize: 8.5, color: C.sandDim, marginTop: 6, transform: "scale(0.9)" }}>
                {item.date.slice(3)}
              </span>
            </div>
          ))}
        </div>
      );
    }

    function DonutChart({ data }) {
      const total = data.reduce((sum, d) => sum + d.value, 0) || 1;
      let cumulativePercent = 0;

      const getCoordinatesForPercent = (percent) => {
        const x = Math.cos(2 * Math.PI * percent);
        const y = Math.sin(2 * Math.PI * percent);
        return [x, y];
      };

      return (
        <div style={{ position: "relative", width: 100, height: 100 }}>
          <svg viewBox="-1 -1 2 2" style={{ transform: "rotate(-90deg)", width: "100%", height: "100%" }}>
            {data.map((slice, i) => {
              const startPercent = cumulativePercent;
              const slicePercent = slice.value / total;
              cumulativePercent += slicePercent;

              const [startX, startY] = getCoordinatesForPercent(startPercent);
              const [endX, endY] = getCoordinatesForPercent(cumulativePercent);
              const largeArcFlag = slicePercent > 0.5 ? 1 : 0;

              const pathData = slicePercent >= 0.99
                ? "M 1 0 A 1 1 0 1 1 -1 0 A 1 1 0 1 1 1 0"
                : `M 0 0 L ${startX} ${startY} A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY} Z`;

              return <path key={i} d={pathData} fill={slice.color} />;
            })}
            {/* Cut out inner circle for donut look */}
            <circle cx="0" cy="0" r="0.6" fill={C.panel} />
          </svg>
        </div>
      );
    }

    function StatCard({ icon, label, value }) {
      return (
        <div style={{ background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 14, padding: "13px 14px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
            {icon}
            <span style={{ fontSize: 11, color: C.sandDim }}>{label}</span>
          </div>
          <div style={{ fontSize: 20, fontWeight: 800, color: C.sand }}>{value}</div>
        </div>
      );
    }

    function SectionTitle({ children }) {
      return <h3 style={{ fontSize: 12, letterSpacing: 0.5, color: C.sandDim, margin: "0 0 10px" }}>{children}</h3>;
    }

    function MonthHeatmap({ transactions }) {
      const map = useMemo(() => Object.fromEntries(transactions.map((t) => [t.date, t])), [transactions]);
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cells = [...Array(firstDay).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];

      return (
        <div style={{ background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 16, padding: 14 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 5, marginBottom: 6 }}>
            {WEEKDAYS.map((w) => (
              <div key={w} style={{ fontSize: 9, color: C.sandDim, textAlign: "center" }}>
                {w[0]}
              </div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 5 }}>
            {cells.map((day, i) => {
              if (!day) return <div key={i} />;
              const key = toKey(new Date(year, month, day));
              const t = map[key];
              let bg = "#1b3843";
              if (t) bg = t.stayedPure ? C.sage : C.rust;
              const isToday = key === toKey(new Date());
              return (
                <div
                  key={i}
                  style={{
                    aspectRatio: "1",
                    borderRadius: 6,
                    background: bg,
                    opacity: t ? 0.85 : 0.5,
                    display: "grid",
                    placeItems: "center",
                    fontSize: 8.5,
                    color: t ? "#0B1F26" : C.sandDim,
                    boxShadow: isToday ? `0 0 0 1.5px ${C.gold}` : "none",
                    fontWeight: 700
                  }}
                >
                  {day}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function BottomNav({ tab, setTab }) {
      const items = [
        { key: "home", label: "Whys", Icon: Sparkles },
        { key: "log", label: "Check-in", Icon: PenLine },
        { key: "dashboard", label: "Insights", Icon: BarChart3 },
      ];

      return (
        <div style={{
          position: "fixed",
          bottom: 0,
          left: "50%",
          transform: "translateX(-50%)",
          width: "100%",
          maxWidth: 460,
          background: C.bg2,
          borderTop: `1px solid ${C.hair}`,
          display: "flex",
          padding: "10px 14px calc(10px + env(safe-area-inset-bottom))",
          zIndex: 30
        }}>
          {items.map(({ key, label, Icon }) => (
            <button
              key={key}
              onClick={() => setTab(key)}
              style={{
                flex: 1,
                background: "transparent",
                border: "none",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 4,
                padding: "4px 0",
                cursor: "pointer"
              }}
            >
              <Icon size={19} color={tab === key ? C.gold : C.slate} />
              <span style={{ fontSize: 10.5, color: tab === key ? C.gold : C.slate, fontWeight: tab === key ? 700 : 500 }}>
                {label}
              </span>
            </button>
          ))}
        </div>
      );
    }

    function computeCurrentStreak(transactions) {
      const sorted = [...transactions].sort((a, b) => b.date.localeCompare(a.date));
      let count = 0;
      for (const t of sorted) {
        if (t.stayedPure) count++;
        else break;
      }
      return { count };
    }

    function computeLongestStreak(transactions) {
      const sorted = [...transactions].sort((a, b) => a.date.localeCompare(b.date));
      let max = 0, cur = 0;
      for (const t of sorted) {
        if (t.stayedPure) {
          cur++;
          max = Math.max(max, cur);
        } else cur = 0;
      }
      return max;
    }

    function pct(n, d) {
      return d === 0 ? 0 : Math.round((n / d) * 100);
    }

    function computeRiskWeekday(transactions) {
      if (transactions.length < 7) return null;
      const buckets = {};
      transactions.forEach((t) => {
        const wd = WEEKDAYS[new Date(t.date + "T00:00:00").getDay()];
        buckets[wd] = buckets[wd] || { total: 0, relapse: 0 };
        buckets[wd].total++;
        if (!t.stayedPure) buckets[wd].relapse++;
      });
      let worst = null, worstRate = 0;
      Object.entries(buckets).forEach(([wd, { total, relapse }]) => {
        if (total < 2) return;
        const rate = relapse / total;
        if (rate > worstRate) {
          worstRate = rate;
          worst = wd;
        }
      });
      return worstRate > 0 ? fullDayName(worst) : null;
    }

    function fullDayName(short) {
      const map = { Sun: "Sunday", Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" };
      return map[short] || short;
    }

    function computeRecentTrend(transactions) {
      const sorted = [...transactions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
      const toughCount = sorted.filter((t) => t.feeling === "Negative" || t.feeling === "Urge").length;
      if (toughCount >= 2) {
        return "The last few days have felt heavier than usual — that's worth noticing, not fixing alone. Consider revisiting your whys or reaching out to someone you trust.";
      }
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
